name: Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from flowgrid_memory import __version__; print(__version__)')"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${tag} already exists" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=77' build
          python -m pip install -e '.[mcp]'
      - name: Verify indexed public source boundary
        run: python scripts/check_public_boundary.py
      - name: Run full acceptance suite
        run: ./scripts/run_tests.sh --with-mcp
      - name: Reproducible offline wheel and sdist verification
        shell: bash
        run: |
          set -euo pipefail
          artifacts="${RUNNER_TEMP}/release-artifacts"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python scripts/verify_release.py \
            --output "$artifacts" \
            --work-parent "$RUNNER_TEMP" \
            --require-committed
          mkdir -p dist
          cp "$artifacts"/* dist/
      - name: Fresh wheel install and smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/smoke_wheel.py dist/*.whl
      - name: Verify container targets
        shell: bash
        run: |
          set -euo pipefail
          docker build --target cli -t flowgrid-agent-memory:release .
          docker run --rm flowgrid-agent-memory:release
          docker run --rm flowgrid-agent-memory:release demo --ephemeral
          docker build --target mcp -t flowgrid-agent-memory:mcp-release .
          python scripts/smoke_mcp.py --container-image flowgrid-agent-memory:mcp-release
      - name: Generate checksums, acceptance, SBOM, and provenance
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python scripts/generate_release_evidence.py \
            --dist dist \
            --output release-evidence \
            --version "${{ steps.version.outputs.version }}" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$run_url" \
            --tests-passed \
            --fresh-install-passed \
            --container-passed
      - name: Attest wheel and sdist provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest SPDX SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release-evidence/sbom.spdx.json
      - name: Create annotated tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          tag_ref="refs/tags/${tag}"
          # Recover only the tag-pushed / Release-not-created state.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release ${tag} already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          local_tag_exists=0
          if git show-ref --verify --quiet "$tag_ref"; then
            local_tag_exists=1
            if ! local_commit="$(git rev-parse --verify "${tag_ref}^{commit}" 2>/dev/null)"; then
              echo "existing local tag ${tag} does not resolve to a commit" >&2
              exit 1
            fi
            if [[ "$local_commit" != "$GITHUB_SHA" ]]; then
              echo "existing local tag ${tag} conflicts with this release commit" >&2
              exit 1
            fi
          fi
          if ! remote_refs="$(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}")"; then
            echo "cannot inspect remote tag ${tag}" >&2
            exit 1
          fi
          remote_commit="$(printf '%s\n' "$remote_refs" | awk -v ref="${tag_ref}^{}" '$2 == ref { print $1 }')"
          if [[ -z "$remote_commit" ]]; then
            remote_commit="$(printf '%s\n' "$remote_refs" | awk -v ref="$tag_ref" '$2 == ref { print $1 }')"
          fi
          if [[ -n "$remote_commit" ]]; then
            if [[ "$remote_commit" != "$GITHUB_SHA" ]]; then
              echo "existing remote tag ${tag} conflicts with this release commit" >&2
              exit 1
            fi
            if [[ "$local_tag_exists" == 0 ]]; then
              git fetch --no-tags origin "${tag_ref}:${tag_ref}"
              fetched_commit="$(git rev-parse --verify "${tag_ref}^{commit}")"
              if [[ "$fetched_commit" != "$GITHUB_SHA" ]]; then
                echo "fetched tag ${tag} changed during release preparation" >&2
                exit 1
              fi
            fi
          else
            if [[ "$local_tag_exists" == 0 ]]; then
              git tag -a "$tag" "$GITHUB_SHA" -m "FlowGrid Agent Memory ${tag}"
            fi
            git push origin "${tag_ref}:${tag_ref}"
          fi
          mkdir -p release-assets
          cp dist/* release-assets/
          cp release-evidence/* release-assets/
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "FlowGrid Agent Memory ${tag}" \
            --notes-file docs/RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
