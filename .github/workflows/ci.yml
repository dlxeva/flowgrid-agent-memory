name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip 'setuptools>=77'
      - run: python -m pip install -e .
      - name: Verify public source boundary
        run: python scripts/check_public_boundary.py
      - run: ./scripts/run_tests.sh

  windows:
    name: Core / Windows Python 3.12
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip 'setuptools>=77'
      - run: python -m pip install -e .
      - run: python scripts/check_public_boundary.py
      - run: python -m unittest discover -s tests
      - run: python -m aml_retriever.cli selfcheck

  mcp:
    name: MCP adapter / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip 'setuptools>=77'
      - run: python -m pip install -e '.[mcp]'
      - run: ./scripts/run_tests.sh --with-mcp

  release-verification:
    name: Offline reproducible release / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'setuptools>=77'
      - run: python scripts/check_public_boundary.py
      - name: Rebuild and install both archives offline
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python scripts/verify_release.py \
            --output "$RUNNER_TEMP/release-artifacts" \
            --work-parent "$RUNNER_TEMP" \
            --require-committed

  container:
    name: Container contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install 'mcp>=2,<3' build
      - name: Build and verify isolated wheel
        run: |
          python -m build
          python scripts/smoke_wheel.py dist/*.whl
      - name: Build and run default CLI target
        run: |
          docker build --target cli -t flowgrid-agent-memory:ci .
          docker run --rm flowgrid-agent-memory:ci
          docker run --rm flowgrid-agent-memory:ci demo --ephemeral
      - name: Build and exercise MCP stdio target
        run: |
          docker build --target mcp -t flowgrid-agent-memory:mcp-ci .
          python scripts/smoke_mcp.py --container-image flowgrid-agent-memory:mcp-ci
